<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTool</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #17202a; background: #f4f6f8; }
  body { max-width: 760px; margin: 4rem auto; padding: 0 1rem; }
  main { background: white; padding: 2rem; border-radius: 14px; box-shadow: 0 4px 24px #15202b12; }
  h1 { margin-top: 0; font-size: 1.7rem; }
  label { display: block; margin: 1.2rem 0 .4rem; font-weight: 650; }
  textarea { box-sizing: border-box; width: 100%; min-height: 120px; padding: .8rem; font: inherit; border: 1px solid #aab4bd; border-radius: 8px; }
  button { margin-top: 1rem; padding: .7rem 1.2rem; border: 0; border-radius: 8px; color: white; background: #1769aa; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { margin-top: 1.5rem; font-weight: 650; }
  #job { color: #52616b; overflow-wrap: anywhere; }
  #answer { padding: 1rem; background: #f4f6f8; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2rem; }
  .hint { color: #52616b; }
</style>
<main>
  <h1>MyTool ↔ ChatGPT</h1>
  <p class="hint">Mở một tab ChatGPT đã đăng nhập trong Chrome và bật MyTool Bridge Extension. Nội dung bên dưới sẽ được gửi thật tới tab đó.</p>
  <form id="form">
    <label for="message">Nội dung gửi ChatGPT</label>
    <textarea id="message" required>Xin hãy trả lời: CONNECTED</textarea>
    <button id="send" type="submit">Check Connect</button>
  </form>
  <p id="status" role="status">Sẵn sàng</p>
  <p id="job"></p>
  <h2>Phản hồi</h2>
  <div id="answer" aria-live="polite"></div>
</main>
<script>
  const form = document.querySelector("#form");
  const button = document.querySelector("#send");
  const status = document.querySelector("#status");
  const job = document.querySelector("#job");
  const answer = document.querySelector("#answer");
  const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
  let active = false;

  async function api(path, options) {
    const response = await fetch(path, { cache: "no-store", ...options });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error + ": " + data.message);
    return data;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (active) return;
    active = true;
    button.disabled = true;
    answer.textContent = "";
    const id = "mytool-" + crypto.randomUUID();
    job.textContent = "Job ID: " + id;
    try {
      status.textContent = "Đang gửi tới Bridge...";
      await api("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          job_id: id, provider: "chatgpt", action: "prompt",
          content: document.querySelector("#message").value, options: {}
        })
      });
      const deadline = Date.now() + 240000;
      while (Date.now() < deadline) {
        const record = await api("/api/jobs/" + encodeURIComponent(id));
        status.textContent = "Trạng thái: " + record.status;
        if (record.status === "completed" || record.status === "error") {
          answer.textContent = record.status === "completed"
            ? record.result.text
            : record.result.error + ": " + record.result.message;
          return;
        }
        await pause(1000);
      }
      status.textContent = "Hết thời gian chờ; job có thể vẫn đang chạy.";
    } catch (error) {
      status.textContent = "Lỗi: " + error.message;
    } finally {
      active = false;
      button.disabled = false;
    }
  });
</script>
</html>
